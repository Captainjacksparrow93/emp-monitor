# Builds the EmpMonitor desktop agent installers for Windows (.exe) and macOS (.dmg / .zip).
#
# - Manual run (Actions tab → "Build desktop agent" → Run workflow): installers are attached as workflow artifacts.
# - Push a tag like `agent-v1.0.0`: installers are also published to a GitHub Release
#   (point AGENT_DOWNLOAD_WIN / AGENT_DOWNLOAD_MAC on the server at that release page).
#
# Optional code signing (strongly recommended for production, otherwise Windows SmartScreen and
# macOS Gatekeeper show warnings). Add these repository secrets and they are picked up automatically:
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
#   macOS:   MAC_CSC_LINK (base64 .p12 "Developer ID Application"), MAC_CSC_KEY_PASSWORD,
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (for notarization)
name: Build desktop agent

on:
  workflow_dispatch:
  push:
    tags: ['agent-v*']
  # Verify installer builds on PRs that touch the agent (artifacts are uploaded; nothing is published).
  pull_request:
    paths:
      - 'pg-edition/agent/**'
      - '.github/workflows/pg-edition-agent.yml'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pg-edition/agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pg-edition/agent/package-lock.json

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/agent-v')
        shell: bash
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#agent-v}"

      - run: npm ci

      - run: npm test

      - name: Build installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ runner.os }}
          path: |
            pg-edition/agent/dist/*.exe
            pg-edition/agent/dist/*.dmg
            pg-edition/agent/dist/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pg-edition/agent/dist/*.exe
            pg-edition/agent/dist/*.dmg
            pg-edition/agent/dist/*.zip
